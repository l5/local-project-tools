<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML Scope Estimator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
    <button id="toggleButton" style="color: #aaaaaa; position: fixed; top: -10px; left: 0; z-index: 1000; padding: 5px; background-color: #ffffff; border: none; cursor: pointer;">☰</button>
    <div id="yamlInput">
        <h3>Source Project Plan YAML</h3>
        <textarea id="yamlTextarea" placeholder="Paste your YAML here..."></textarea>
        <div id="cursorPosition">Line: 1, Column: 1</div>
    </div>
    <div id="renderedOutput">
        <h3>Scope Elements</h3>
        <div id="outputContainer"></div>
        <div id="summaryContainer" class="summary"></div>
    </div>

    <!-- Inject renderer.js content here -->
    <!-- @@RENDERER_JS@@ -->

    <div style="position: absolute; bottom: 10px; right: 30px; font-size: 0.7em; color: #aaaaaa;">
        <a href="https://l5.github.io/local-project-tools/" target="_blank" style="text-decoration: none; color: #aaaaaa;">Generated by Local Project Tools</a>
    </div>

    <!-- Renderer logic will be executed based on textarea input -->
    <script src="renderer.browser.js"></script>
    <script>
        const textarea = document.getElementById('yamlTextarea');
        const outputContainer = document.getElementById('outputContainer');
        const summaryContainer = document.getElementById('summaryContainer');
        const cursorPosition = document.getElementById('cursorPosition');

        // Function to update the cursor position
        function updateCursorPosition() {
            const text = textarea.value.substr(0, textarea.selectionStart);
            const lines = text.split('\n');
            const line = lines.length;
            const column = lines[lines.length - 1].length + 1;
            cursorPosition.textContent = `Line: ${line}, Column: ${column}`;
        }

        // Function to render the YAML content when the textarea is updated
        function renderYamlFromTextarea() {
            const yamlText = textarea.value;
            Renderer.renderYaml(yamlText, outputContainer, summaryContainer);
        }

        // Update YAML rendering and cursor position on textarea input
        textarea.addEventListener('input', () => {
            updateCursorPosition();
            renderYamlFromTextarea();
        });

        // Initialize cursor position on load
        updateCursorPosition();

        // Render YAML if already present on load (optional: useful for testing pre-filled textarea)
        if (textarea.value) {
            renderYamlFromTextarea();
        }
    </script>
</body>
</html>
